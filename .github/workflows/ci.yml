name: offline-contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Unit and HTTP contracts
        run: python -m pytest -q
      - name: Lint
        run: ruff check search_lab tests
      - name: DOM contracts (runner Node)
        run: node --test tests/dom.test.js
      - name: Runtime dependency audit
        run: pip-audit --disable-pip --no-deps -r requirements.txt
